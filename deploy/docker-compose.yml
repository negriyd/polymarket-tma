services:
  postgres:
    image: postgres:16-alpine
    container_name: polymarket-postgres
    environment:
      POSTGRES_DB: polymarket_tma
      POSTGRES_USER: polymarket
      POSTGRES_PASSWORD: polymarket
    # 5433 on host to avoid clashing with other local postgres instances.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polymarket"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: polymarket-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile.backend
    container_name: polymarket-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_PROFILE: ${APP_PROFILE:-dev}
      POSTGRES_URL: jdbc:postgresql://postgres:5432/polymarket_tma
      POSTGRES_USER: polymarket
      POSTGRES_PASSWORD: polymarket
      REDIS_URL: redis://redis:6379
    ports:
      - "8080:8080"
    profiles: ["full"]

  frontend:
    build:
      context: ../frontend
      dockerfile: ../deploy/Dockerfile.frontend
      args:
        # Baked into the JS bundle at build time. Empty = same-origin `/api` + `/ws` (nginx proxies to backend).
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_PRIVY_APP_ID: ${VITE_PRIVY_APP_ID:-}
        VITE_POLYGON_RPC_URL: ${VITE_POLYGON_RPC_URL:-https://polygon-rpc.com}
        # Node heap for `vite build` (MB). Do not use NODE_OPTIONS=--... in compose defaults: `:-` eats one `-`.
        # On a 2GB RAM Droplet set NODE_MEMORY_MB=1536 in deploy/.env (plus swap) or build on CI.
        NODE_MEMORY_MB: ${NODE_MEMORY_MB:-4096}
    container_name: polymarket-frontend
    depends_on:
      backend:
        condition: service_started
    ports:
      - "5173:80"
    profiles: ["full"]

volumes:
  pgdata:
  redisdata:
