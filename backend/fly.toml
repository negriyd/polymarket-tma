# Spring Boot API only. Full stack (Postgres, Redis, SPA): see deploy/fly/README.md
app = "polymarket-tma-backend"
primary_region = "fra"

[build]
  dockerfile = "../deploy/Dockerfile.backend"

[env]
  SERVER_PORT = "8080"
  APP_PROFILE = "prod"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  grace_period = "30s"
  interval = "15s"
  method = "get"
  path = "/actuator/health/liveness"
  timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
